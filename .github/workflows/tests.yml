name: Tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # setup-python has no 3.9 build for Ubuntu 26.04 (ubuntu-latest)
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v7
      # Install the matrix Python for the test env, plus 3.14 last so that
      # hatch itself runs on 3.14 (hatch on 3.9 breaks with virtualenv 21).
      - name: Set up Python ${{ matrix.python-version }} and 3.14
        uses: actions/setup-python@v6
        with:
          python-version: |
            ${{ matrix.python-version }}
            3.14
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch pre-commit
          hatch env create
      - name: Lint and typecheck
        run: |
          hatch run lint:all
      - name: Run Tests
        run: |
          PY='${{ matrix.python-version }}'
          hatch run +py=$(printf '%s%02d' "${PY%%.*}" "${PY#*.}") test:pytest
